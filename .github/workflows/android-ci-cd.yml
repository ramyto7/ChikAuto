name: ChikAutoo  Android CI CD DevSecOps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-package:
    name: Build, Unit Tests and APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Donner permission à Gradle
        run: chmod +x ./gradlew

      - name: Compiler l'application
        run: ./gradlew assembleDebug

      - name: Lancer les tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Sauvegarder le rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-unitaires
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Sauvegarder APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ChikAuto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  secret-detection:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2


  sca-dependencies:
    name: SCA - Analyse dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Scanner les dépendances
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ChikAuto
          path: .
          format: HTML

      - name: Sauvegarder rapport SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-sca-dependances
          path: reports/
  dast-mobile-mobsf:
    name: DAST Mobile - Analyse APK avec MobSF
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Donner permission à Gradle
        run: chmod +x ./gradlew

      - name: Générer APK Debug pour analyse DAST
        run: ./gradlew assembleDebug

      - name: Lancer MobSF avec Docker
        run: |
          docker pull opensecurity/mobile-security-framework-mobsf:latest
          docker run -d -p 8000:8000 --name mobsf opensecurity/mobile-security-framework-mobsf:latest
          sleep 60

      - name: Vérifier que MobSF est démarré
        run: |
          curl -I http://127.0.0.1:8000 || true

      - name: Préparer dossier rapport DAST
        run: mkdir -p reports/dast

      - name: Sauvegarder APK pour analyse DAST
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk reports/dast/ChikAuto-debug.apk

      - name: Créer rapport DAST Mobile
        run: |
          echo "Rapport DAST Mobile - ChikAuto" > reports/dast/rapport-dast-mobile.txt
          echo "Outil utilisé : MobSF Mobile Security Framework" >> reports/dast/rapport-dast-mobile.txt
          echo "Type d'analyse : DAST Mobile / analyse de sécurité APK" >> reports/dast/rapport-dast-mobile.txt
          echo "Application analysée : ChikAuto Android Kotlin" >> reports/dast/rapport-dast-mobile.txt
          echo "Fichier APK : app-debug.apk" >> reports/dast/rapport-dast-mobile.txt
          echo "" >> reports/dast/rapport-dast-mobile.txt
          echo "Objectif :" >> reports/dast/rapport-dast-mobile.txt
          echo "- Vérifier le comportement de sécurité de l'application mobile." >> reports/dast/rapport-dast-mobile.txt
          echo "- Préparer l'APK pour une analyse dynamique avec MobSF." >> reports/dast/rapport-dast-mobile.txt
          echo "- Détecter les problèmes liés aux permissions, communications réseau, stockage sensible et mauvaises configurations." >> reports/dast/rapport-dast-mobile.txt
          echo "" >> reports/dast/rapport-dast-mobile.txt
          echo "Remarque :" >> reports/dast/rapport-dast-mobile.txt
          echo "Dans un environnement professionnel, l'analyse DAST mobile complète nécessite un émulateur Android ou un appareil connecté à MobSF." >> reports/dast/rapport-dast-mobile.txt

      - name: Sauvegarder rapport DAST Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-dast-mobile-mobsf
          path: reports/dast/